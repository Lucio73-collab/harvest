[project]
name = "harvest"
version = "1.0.0"
description = "Polite, general-purpose web scraper with crawling, JS rendering, smart extraction, change tracking and a local dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.27",
  "parsel>=1.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "openpyxl>=3.1",
  "croniter>=2.0",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
harvest = "harvest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harvest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
